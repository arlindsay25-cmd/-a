<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0057b8"><link rel="apple-touch-icon" href="icon-192.png"><title>Seagulls · Brighton &amp; Hove Albion</title>

<style>
:root{--bg:#f3f7fd;--cd:#fff;--tx:#0a1f44;--mu:#5d6f8f;--ac:#0057b8;--bd:#dde6f3;--w:#16a34a;--l:#dc2626;--d:#d97706;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050d1f;--cd:#0c1a36;--tx:#eef3fc;--mu:#8fa3c7;--ac:#4d9bff;--bd:#183058;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#050d1f;--cd:#0c1a36;--tx:#eef3fc;--mu:#8fa3c7;--ac:#4d9bff;--bd:#183058;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.cn{font-family:"Barlow Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow",Impact,sans-serif;text-transform:uppercase;margin:0;letter-spacing:.02em}
main{max-width:560px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}
header h1{font-size:30px;font-weight:800;line-height:1}header small{color:var(--mu)}.lo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#0057b8,#0a2a66);display:grid;place-items:center;flex:none}.lo img{width:34px}
.v{animation:up .5s both}@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#0057b8,#0a2a66 70%);color:#fff;border:0;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 28px,rgba(255,255,255,.05) 28px 56px);pointer-events:none}
.hero>*{position:relative;z-index:1}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:600}
.sc{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;margin:12px 0 4px}
.sc .n{font-size:13px;font-weight:600}.sc .big{font-family:"Barlow Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow",sans-serif;font-weight:800;font-size:56px;line-height:1}
.b{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 6px;border-radius:50%;background:rgba(255,255,255,.14);font:800 15px "Barlow Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow",sans-serif;font-style:normal;border:2px solid rgba(255,255,255,.3)}
